name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: readscan-windows-x64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: readscan-macos-apple-silicon
          - os: macos-latest
            target: x86_64-apple-darwin
            asset: readscan-macos-intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Download OCR models (built into the program)
        shell: bash
        run: |
          mkdir -p models
          curl -sSfL https://ocrs-models.s3-accelerate.amazonaws.com/text-detection.rten -o models/text-detection.rten
          curl -sSfL https://ocrs-models.s3-accelerate.amazonaws.com/text-recognition.rten -o models/text-recognition.rten

      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release

      - name: Build
        shell: bash
        run: |
          cargo build --release --target ${{ matrix.target }}
          ext=""; [[ "${{ matrix.target }}" == *windows* ]] && ext=".exe"
          cp "target/${{ matrix.target }}/release/readscan$ext" ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "readscan $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md

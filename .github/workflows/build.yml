name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset: readscan-windows-x64.exe
          - os: macos-latest
            asset: readscan-macos-universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2

      - name: Download OCR models (built into the program)
        shell: bash
        run: |
          mkdir -p models
          curl -sSfL https://ocrs-models.s3-accelerate.amazonaws.com/text-detection.rten -o models/text-detection.rten
          curl -sSfL https://ocrs-models.s3-accelerate.amazonaws.com/text-recognition.rten -o models/text-recognition.rten

      - run: cargo test --release

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cargo build --release
          cp target/release/readscan.exe ${{ matrix.asset }}

      - name: Build (macOS, Apple Silicon + Intel in one binary)
        if: matrix.os == 'macos-latest'
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output ${{ matrix.asset }} \
            target/aarch64-apple-darwin/release/readscan \
            target/x86_64-apple-darwin/release/readscan
          chmod +x ${{ matrix.asset }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "readscan $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md

name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            exe: readscan.exe
            archive: readscan-windows-x64
          - os: macos-latest
            exe: readscan
            archive: readscan-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: cargo test --release
      - run: cargo build --release

      - name: Bundle binary with OCR models
        shell: bash
        run: |
          mkdir -p dist/models
          cp target/release/${{ matrix.exe }} dist/
          cp README.md dist/
          curl -sSfL https://ocrs-models.s3-accelerate.amazonaws.com/text-detection.rten -o dist/models/text-detection.rten
          curl -sSfL https://ocrs-models.s3-accelerate.amazonaws.com/text-recognition.rten -o dist/models/text-recognition.rten

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: dist/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.archive }}.zip
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $env:GITHUB_REF_NAME --title $env:GITHUB_REF_NAME --notes "" }
          gh release upload $env:GITHUB_REF_NAME ${{ matrix.archive }}.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
